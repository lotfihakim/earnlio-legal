<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnlio - Reset password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:auto;padding:20px;background:#0b0f1a;color:#eef}h1{color:#2ecc71}input,button{width:100%;padding:13px;margin:6px 0;font-size:16px;border-radius:12px;border:0;box-sizing:border-box}input{background:#1d2540;color:#fff}button{background:#2ecc71;font-weight:700}</style></head><body>
<h1>Earnlio</h1><div id="box"><p>جارٍ التحقق من الرابط... / Checking link...</p></div>
<script>
const sb=supabase.createClient("https://pdlnqodmtofogrhnjuce.supabase.co","sb_publishable_lvn_dGs_wLS36gjtNDl9fQ_3DOjsAkc");
const box=document.getElementById("box");
function form(){box.innerHTML='<p>كلمة السر الجديدة / New password</p><input id="np" type="password" placeholder="6+"><button id="go">Save / حفظ</button><p id="m"></p>';
document.getElementById("go").onclick=async()=>{const p=document.getElementById("np").value;if(p.length<6){document.getElementById("m").textContent="6+";return}
const r=await sb.auth.updateUser({password:p});
document.getElementById("m").textContent=r.error?r.error.message:"تم ✅ ارجع للتطبيق وسجّل الدخول / Done ✅ go back to the app and log in"}}
sb.auth.onAuthStateChange((e)=>{if(e=="PASSWORD_RECOVERY")form()});
setTimeout(()=>{if(!document.getElementById("np"))box.innerHTML="<p>الرابط غير صالح أو منتهي. اطلب رابطاً جديداً من التطبيق. / Invalid or expired link. Request a new one from the app.</p>"},4000);
</script></body></html>
